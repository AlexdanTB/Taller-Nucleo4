<h1>Catálogo de libros</h1>
<button>Ver rol</button>
<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3">
    <div class="card">
        @for (libro of libros(); track $index) {
        <div class="card-body">
            <h3 class="card-title">{{libro.titulo}}</h3>
            <h5 class="card-text">{{libro.autor}}</h5>
            <p>{{libro.sinopsis}}</p>
            <h6 class="card-text">{{libro.genero}}</h6>
            <a href="#" class="card-link">Agregar Carrito</a>
        </div>
        }
    </div>
</div>
