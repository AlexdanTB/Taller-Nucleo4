<h2>Crea tu cuenta</h2>
<form (ngSubmit)="registro()">
    <div class="mb-3 mt-3">
    <label for="email" class="form-label">Nombre de usuario:</label>
    <input type="text" class="form-control" id="name" placeholder="Enter username" name="name" [(ngModel)]="name">
  </div>
  <div class="mb-3 mt-3">
    <label for="email" class="form-label">Email:</label>
    <input type="email" class="form-control" id="email" placeholder="Enter email" name="email" [(ngModel)]="email">
  </div>
  <div class="mb-3">
    <label for="pwd" class="form-label">Password:</label>
    <input type="text" class="form-control" id="pwd" placeholder="Enter password" name="pswd" [(ngModel)]="password">
  </div>
  <button type="submit" class="btn btn-primary">Registrar</button>
</form>
